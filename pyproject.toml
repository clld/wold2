[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wold2"
version = "1.0.0"
description = "clld app serving WOLD."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Robert Forkel", email = "dlce.rdm@eva.mpg.de"}
]
keywords = ["web", "pyramid", "clld"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "clld>=13.1",
    "clld-glottologfamily-plugin",
    "clldmpg>=4.5",
    "sqlalchemy",
    "psycopg",
]

[project.urls]
Homepage = "https://github.com/clld/wold2"

[project.optional-dependencies]
initdb = [
    "clld[initdb]",
    "pyglottolog",
]
dev = [
    "clld[dev]",
]
test = [
    "pytest>=5",
    "pytest-clld>=1.0.3",
    "pytest-mock",
    "pytest-cov",
    "coverage>=4.2",
    "selenium",
    "zope.component>=3.11.0",
]

[project.entry-points."paste.app_factory"]
main = "wold2:main"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
wold2 = [
    "locale/**",
    "templates/**/*",
    "static/**",
]

[tool.babel]

[[tool.babel.mappings]]
method = "ignore"
pattern = ["static/**"]

[[tool.babel.mappings]]
method = "python"
pattern = "**.py"

[[tool.babel.mappings]]
method = "mako"
pattern = "**.mako"
encoding = "utf8"

[tool.ruff]
line-length = 100
exclude = [".tox"]

[tool.ruff.lint]
select = ["UP", "N", "C90", "PL", "E", "F"]
ignore = [
    "E711", # Comparison to `None` should be `cond is None` (needed for SQLAlchemy filters)
    "E712", # Comparison to `True` should be `cond is True` (needed for SQLAlchemy filters)
]

[tool.pytest.ini_options]
minversion = "5.0"
addopts = [
    "--cov",
]
filterwarnings = [
    "ignore::sqlalchemy.exc.SAWarning",
]
markers = ["selenium: webtest using selenium"]

[tool.coverage.run]
source = [
    "wold2",
    "tests",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
